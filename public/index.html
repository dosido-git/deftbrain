<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1e293b" />

    <!-- Primary SEO Meta Tags -->
    <title>DeftBrain — Better questions lead to better decisions</title>
    <meta name="description" content="Let's think it through together. 125+ free guided experiences for real life — read a lease, check a repair quote, spot a scam, prepare for a doctor visit. Each one already knows what to ask you. No signup, nothing stored, 13 languages." />
    <meta name="author" content="DeftBrain.com" />
    <meta name="robots" content="index, follow" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://deftbrain.com" />

    <!-- Open Graph (crawlers read these — useDocumentHead overrides at runtime per tool) -->
    <meta property="og:title" content="DeftBrain — Better questions lead to better decisions" />
    <meta property="og:description" content="Let's think it through together. 125+ free guided experiences, each one already knowing what to ask you about one specific situation. No signup, nothing stored." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://deftbrain.com" />
    <meta property="og:site_name" content="DeftBrain" />
    <meta property="og:image" content="https://deftbrain.com/og/default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DeftBrain — Better questions lead to better decisions" />
    <meta name="twitter:description" content="Let's think it through together. 125+ free guided experiences, each one already knowing what to ask you about one specific situation. No signup, nothing stored." />
    <meta name="twitter:image" content="https://deftbrain.com/og/default.png" />

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />


    <!-- Structured Data (JSON-LD) — a single @graph, not three loose blocks.
         Organization and WebSite carry stable @ids so every other page on the
         site (tool prerenders, guide pages) REFERENCES them instead of
         restating a name+url stub. That is what lets a crawler or an AI
         retrieval system resolve "DeftBrain" to one entity rather than
         inferring a different one per page.

         prerender.js strips all ld+json from TOOL pages and substitutes a
         per-tool SoftwareApplication, so this block is homepage-only. The
         homepage variant does not go through that stripper. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://deftbrain.com/#organization",
          "name": "DeftBrain",
          "url": "https://deftbrain.com",
          "logo": {
            "@type": "ImageObject",
            "url": "https://deftbrain.com/logo512.png",
            "width": 512,
            "height": 512
          },
          "description": "DeftBrain builds free, single-purpose guided experiences for everyday situations. Each one encodes the questions an expert would ask — about a lease, a repair quote, a medical appointment, a scam message, a hard conversation — so the user never has to phrase the problem themselves."
        },
        {
          "@type": "WebSite",
          "@id": "https://deftbrain.com/#website",
          "name": "DeftBrain",
          "alternateName": "DeftBrain — Skill in Handling Things",
          "url": "https://deftbrain.com",
          "publisher": { "@id": "https://deftbrain.com/#organization" },
          "inLanguage": ["en", "es", "zh", "hi", "ar", "pt", "fr", "de", "ja", "ko", "ru", "th", "vi"],
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://deftbrain.com/ToolFinder?q={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "WebApplication",
          "@id": "https://deftbrain.com/#webapp",
          "name": "DeftBrain",
          "url": "https://deftbrain.com",
          "description": "Let's think it through together. 125+ free guided experiences, each one already knowing what to ask you about one specific situation — a lease, a repair quote, a scam message, a hard conversation. No signup, no account, nothing stored. Available in 13 languages.",
          "applicationCategory": "UtilityApplication",
          "operatingSystem": "Web",
          "browserRequirements": "Requires JavaScript",
          "isPartOf": { "@id": "https://deftbrain.com/#website" },
          "publisher": { "@id": "https://deftbrain.com/#organization" },
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD",
            "availability": "https://schema.org/InStock"
          },
          "featureList": [
            "Read a lease or contract and flag predatory clauses against local law",
            "Check a repair quote or price for padding and overcharging",
            "Identify the specific technique used in a suspected scam message",
            "Prepare for and decode medical appointments",
            "Script difficult conversations and negotiations",
            "Sort an overwhelming task list into an achievable next step"
          ]
        }
      ]
    }
    </script>
  </head>
  <body>
    <!-- Create React App's default read "You need to enable JavaScript to run
         this app." Wrong on two counts: it says "app" rather than naming the
         site, and it implies the page is useless without JS when the
         prerendered description, how-to, tips and FAQ below are perfectly
         readable. The tools themselves genuinely do need JS — they call an
         API — so the message should say which half is unavailable. -->
    <noscript>
      <div style="max-width:640px;margin:0 auto;padding:24px 20px;font-family:'DM Sans',system-ui,sans-serif;line-height:1.6;color:#1a2e44">
        <p style="margin:0 0 8px;font-weight:700">DeftBrain's tools need JavaScript.</p>
        <p style="margin:0;color:#5a544a">The tools run in your browser and call an API, so they cannot work with JavaScript disabled. You can still read what this tool does, how to use it, and its common pitfalls below.</p>
      </div>
    </noscript>
    <div id="root"></div>
  </body>
</html>
